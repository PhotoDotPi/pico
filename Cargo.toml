[package]
name = "pico"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "A modern, backward-compatible replacement for the Unix echo utility"
license = "AGPL-3.0-only"
repository = "https://github.com/PhotoDotPi/pico"
homepage = "https://github.com/PhotoDotPi/pico"
keywords = ["cli", "echo", "text", "utility", "command-line"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "pico"
path = "src/main.rs"

[lib]
name = "pico"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

