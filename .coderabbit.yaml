# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'en-US'
early_access: false
enable_free_tier: true

reviews:
  profile: 'chill'
  request_changes_workflow: false

  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: '@coderabbitai'
  review_status: true
  review_details: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: true
  poem: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  disable_cache: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    drafts: false
    base_branches:
      - '^main$'

  path_filters:
    - '!target/**'

  path_instructions:
    - path: 'src/**'
      instructions: |
        pico is a Rust CLI (edition 2024, rust-version 1.85) replacing Unix echo.
        - Unsafe code is forbidden; do not introduce unsafe blocks.
        - Keep behaviour backward-compatible with POSIX echo and honour POSIXLY_CORRECT / PICO_COMPAT.
        - Extended mode lives under src/extended; keep transformations in the documented order.
        - Flag any change that breaks existing tests or alters output formatting.
    - path: 'tests/**'
      instructions: |
        Tests use the standard Rust test harness. Keep them hermetic and deterministic.
    - path: '.github/workflows/**'
      instructions: |
        - Use least-privilege permissions blocks; never grant write-all.
        - Pin actions to a major version tag or full SHA.
    - path: '**/*.md'
      instructions: |
        Documentation must match shipped behaviour. Verify flags, options, and versions.

  tools:
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    clippy:
      enabled: true
    rustfmt:
      enabled: true

  pre_merge_checks:
    title:
      mode: 'warning'
      requirements: 'Use a Conventional Commits title under 72 characters.'
    description:
      mode: 'warning'
    issue_assessment:
      mode: 'warning'

chat:
  auto_reply: true
  art: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 'CONTRIBUTING.md'
  learnings:
    scope: 'local'
  issues:
    scope: 'local'
  pull_requests:
    scope: 'local'
  web_search:
    enabled: true

issue_enrichment:
  auto_enrich:
    enabled: true
  labeling:
    labeling_instructions:
      - label: 'bug'
        instructions: 'Apply when the issue reports broken behaviour.'
      - label: 'enhancement'
        instructions: 'Apply when the issue requests a new feature or improvement.'
      - label: 'documentation'
        instructions: 'Apply when the issue is about docs, README, or setup instructions.'
