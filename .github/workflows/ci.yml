name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$channel" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Build (release)
        run: cargo build --release --locked
      - name: Test
        run: cargo test --all-features --locked






  build-targets:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$channel" --profile minimal
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - name: Install the aarch64 Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build for ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

  differential:
    name: differential (GNU coreutils 9.12)




    runs-on: ubuntu-24.04
    env:


      COREUTILS_VERSION: "9.12"

      CFLAGS: "-O2 -std=gnu17"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Build the pinned GNU Coreutils reference
        shell: bash
        run: |
          set -euo pipefail
          tarball="coreutils-${COREUTILS_VERSION}.tar.xz"
          url="https://ftp.gnu.org/gnu/coreutils/${tarball}"
          echo "Fetching ${url}"
          curl -fsSLo "$tarball" "$url"
          tar -xf "$tarball"
          cd "coreutils-${COREUTILS_VERSION}"



          ./configure --quiet --disable-nls --without-selinux


          make -j"$(nproc)"
          reference="$PWD/src/echo"



          "$reference" --version | head -n1
          "$reference" --version | head -n1 | grep -F "${COREUTILS_VERSION}" \
            || { echo "::error::reference is not GNU Coreutils ${COREUTILS_VERSION}"; exit 1; }
          echo "PICO_REFERENCE_ECHO=${reference}" >> "$GITHUB_ENV"
      - name: Differential compatibility tests


        run: cargo test --test compat_differential --all-features --locked -- --nocapture
      - name: Process-level behaviour (broken pipe, write errors)



        run: cargo test --test process_behavior --all-features --locked -- --nocapture

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    env:

      MSRV: "1.85.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install MSRV toolchain
        run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Build and test on MSRV
        run: |
          cargo +${{ env.MSRV }} build --locked
          cargo +${{ env.MSRV }} test --all-features --locked

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned toolchain
        shell: bash
        run: |
          channel="$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$channel" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo doc --no-deps --all-features --locked
