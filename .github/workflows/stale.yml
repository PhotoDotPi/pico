name: Stale

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    name: Mark and close stale issues and pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,good first issue,help wanted,blocked'
          exempt-pr-labels: 'pinned,security,dependencies,blocked'
          exempt-all-milestones: true
          exempt-draft-pr: true
          remove-stale-when-updated: true
          stale-issue-message: |
            This issue has been quiet for 60 days. If it is still relevant, please leave a comment.
          close-issue-message: |
            Closing this as stale after 60 days of inactivity.
          stale-pr-message: |
            This pull request has been quiet for 60 days.
          close-pr-message: |
            Closing this as stale after 60 days of inactivity.
